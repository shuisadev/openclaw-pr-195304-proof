name: endpoint-reachability
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: POST chat/completions with secret key
        env:
          K: ${{ secrets.MODEL_API_KEY }}
        run: |
          B=https://maas-apigateway.dt.zte.com.cn/model-public/tokenplan/v1
          echo "== GET /models"; curl -sS -m 20 -o /tmp/m.txt -w "code=%{http_code} ctype=%{content_type}\n" -H "authorization: Bearer $K" "$B/models"; head -c 200 /tmp/m.txt; echo
          echo "== POST /chat/completions"; curl -sS -m 40 -o /tmp/c.txt -w "code=%{http_code} ctype=%{content_type}\n" -H "content-type: application/json" -H "authorization: Bearer $K" -d '{"model":"glm-5.2","messages":[{"role":"user","content":"reply OK"}],"max_tokens":8}' "$B/chat/completions"; head -c 400 /tmp/c.txt; echo
