name: shipped-container-session-proof

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "openclaw branch/ref to prove (default: PR #195304 head branch)"
        required: false
        default: "fix/node-worker-bind-mount-comma-377"

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout proof repo (scripts)
        uses: actions/checkout@v4

      - name: Checkout openclaw at PR ref
        uses: actions/checkout@v4
        with:
          repository: shuisadev/openclaw
          ref: ${{ inputs.ref }}
          path: openclaw

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable corepack / pnpm
        run: |
          corepack enable || true
          node -v

      - name: Pre-pull worker image
        run: docker pull node:24-bookworm-slim

      - name: Run shipped container-session proof (real model)
        env:
          PROOF_REPO_DIR: ${{ github.workspace }}
          PKG: ${{ github.workspace }}/openclaw
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          MODEL_BASE_URL: https://maas-apigateway.dt.zte.com.cn/model-public/tokenplan/v1
          MODEL_ID: glm-5.2
        working-directory: openclaw
        run: |
          chmod +x "$PROOF_REPO_DIR/run-proof.sh"
          set -o pipefail
          bash "$PROOF_REPO_DIR/run-proof.sh" 2>&1 | tee "$PROOF_REPO_DIR"/proof-output.txt

      - name: Upload proof output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-output
          path: ${{ github.workspace }}/proof-output.txt
